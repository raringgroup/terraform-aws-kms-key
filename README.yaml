# Short description of this project
description: |-
  Terraform module to provision a [KMS](https://aws.amazon.com/kms/) key with alias.

  Can be used with [chamber](https://github.com/segmentio/chamber) for managing secrets by storing them in Amazon EC2 Systems Manager Parameter Store.

  * https://aws.amazon.com/systems-manager/features
  * https://aws.amazon.com/blogs/mt/the-right-way-to-store-secrets-using-parameter-store
# How to use this project
usage: |-
  ```hcl
  module "kms_key" {
    source = "git::https://github.com/raringgroup/terraform-aws-kms-key.git?ref=v0.1.0"

    namespace               = "example"
    stage                   = "test"
    name                    = "chamber"
    description             = "KMS key for chamber"
    deletion_window_in_days = 10
    enable_key_rotation     = true
    alias                   = "alias/parameter_store_key"

    context = module.context.self
  }
  ```

  Naming and tagging come from [`terraform-null-context`](https://github.com/raringgroup/terraform-null-context). Add `_context.tf` to the calling configuration and pass `context = module.context.self`.

